<div class="shell-backdrop">
  <app-bottom-nav />

  <div class="app-frame">
    <app-top-bar
      [displayName]="user().displayName || ''"
      [coins]="user().coins"
      [seasonPoints]="seasonPoints()"

    <main class="content-area">
      <ng-content />
    </main>
  </div>
</div>
